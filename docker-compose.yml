# Локальный запуск трекера вакансий: два сервиса + файл SQLite в bind-mount.
#
# ВАЖНО: у приложения нет авторизации (п. 7 ТЗ), поэтому порт биндится
# строго на 127.0.0.1 и инструмент недоступен из локальной сети.
# Backend свой порт на хост не публикует вовсе — он нужен только nginx-у.
#
# Значения по умолчанию рассчитаны на запуск без настройки.
# Чтобы что-то поменять, скопируйте .env.example в .env — compose подхватит его сам.

services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DB_PATH: /data/hopecore.db
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-10s}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Языковые модели (Этап 2). Ключи необязательны: без них заполнение
      # через модель недоступно, остальное работает как раньше.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_GEMINI_MODELS: ${LLM_GEMINI_MODELS:-}
      LLM_CLAUDE_MODELS: ${LLM_CLAUDE_MODELS:-}
      LLM_DEEPSEEK_MODELS: ${LLM_DEEPSEEK_MODELS:-}
      LLM_GEMINI_PRICE_INPUT: ${LLM_GEMINI_PRICE_INPUT:-}
      LLM_GEMINI_PRICE_OUTPUT: ${LLM_GEMINI_PRICE_OUTPUT:-}
      LLM_CLAUDE_PRICE_INPUT: ${LLM_CLAUDE_PRICE_INPUT:-}
      LLM_CLAUDE_PRICE_OUTPUT: ${LLM_CLAUDE_PRICE_OUTPUT:-}
      LLM_DEEPSEEK_PRICE_INPUT: ${LLM_DEEPSEEK_PRICE_INPUT:-}
      LLM_DEEPSEEK_PRICE_OUTPUT: ${LLM_DEEPSEEK_PRICE_OUTPUT:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_FETCH_TIMEOUT: ${LLM_FETCH_TIMEOUT:-15s}
      LLM_MAX_PAGE_CHARS: ${LLM_MAX_PAGE_CHARS:-40000}
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
