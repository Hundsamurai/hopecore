server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # SPA: любой неизвестный путь отдаём index.html, роутинг разбирает фронт.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Единственный вход в backend. Префикс /api сохраняется (proxy_pass без пути),
    # поэтому фронту не нужен ни адрес backend, ни CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Массовая проверка вакансий ходит по внешним сайтам и может быть долгой.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
